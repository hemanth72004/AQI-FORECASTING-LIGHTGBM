name: Hourly AQI Forecast

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 * * * *'
  # Allows manual runs from the Actions tab
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        # Fetch entire history needed for git diff and commit
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          echo "Dependencies installed."

      - name: Run Forecast Script
        env:
          # Pass the secret API key to the Python script
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          echo "Running forecast script..."
          python run_forecast_openweather.py
          echo "Script finished."


      - name: Commit and Push Forecast Data
        run: |
          echo "Checking for changes in forecast file..."
          # Check if the file exists first
          if [ ! -f forecasts.json ]; then
            echo "forecasts.json not found. Exiting."
            exit 1
          fi
          
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Use git diff --quiet to check for changes efficiently
          if git diff --quiet forecasts.json; then
            echo "No changes detected in forecasts.json."
          else
            echo "Changes detected. Committing forecasts.json..."
            git add forecasts.json
            git commit -m "Update AQI forecast data"
            echo "Pushing changes..."
            git push
            echo "Changes pushed."
          fi

